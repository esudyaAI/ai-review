include:
  - local: templates/ai-review.yml
    # The reviewer gates jobbytime-go; it has no business exempting itself. A tool
    # that blocks other people's merge requests and lets its own through on a
    # warning is trusted less than it asks others to trust it.
    #
    # Two things make this safe to switch on here, and both are load-bearing:
    #
    # 1. `python -m reviewer` runs from the checked-out repository, whose own
    #    `reviewer/` package shadows the one installed in the image. So this job
    #    reviews the branch's code, not the last released `v1`. Confirmed on
    #    2026-08-17: a log line added minutes earlier in a branch appeared in the
    #    job while `v1` still pointed at the previous release. Consuming
    #    repositories have no `reviewer/` directory, so there the image wins.
    # 2. The escape hatch is this very input. If a change breaks the reviewer so
    #    badly that it cannot pass its own gate, set `allow_failure: true` in the
    #    merge request that fixes it, and restore it in the same merge request
    #    once green. That is a visible, reviewable act - unlike a permanent
    #    exemption, which is invisible.
    # judgeai: shadow mode until OPENAI_API_KEY / ANTHROPIC_API_KEY and
    # AI_REVIEW_GITLAB_TOKEN are set as CI variables of the judgeai group.
    # Switch back to false in the merge request that confirms the first green run.
    inputs:
      allow_failure: true

# Without this block a push to a branch with an open merge request builds two
# pipelines for the same commit, and only one of them is the one the merge
# request shows. That is how `test` ended up running where nobody was looking:
# in the push pipeline, while the merge request was gated by ai-review alone.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

test:
  stage: test
  image: python:3.12-slim
  interruptible: true
  # A job without rules is branches-and-tags only, so this one did not run in
  # merge request pipelines at all - the very pipeline the merge request is
  # judged by. The unit tests were green in a pipeline nobody was reading.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -e ".[dev]"
    - python -m pytest -v

# Та же сюита на нижней объявленной версии Python.
#
# requires-python в pyproject.toml был утверждением, которое ничто не проверяло,
# и оно разошлось с фактом: стояло ">=3.12", при том что весь пакет собирается и
# все тесты проходят на 3.10. Разошлось не в безопасную сторону - соседние
# Python-проекты (матчер, infra) живут на 3.11, и объявленный пол выше их
# означал бы, что общий код нельзя переиспользовать, хотя технически можно.
#
# Образ здесь и floor в pyproject связаны тестом tests/unit/test_python_floor.py:
# два места, названные руками, разъезжаются - это и есть тот дефект, который
# джоба закрывает.
test_floor:
  stage: test
  image: python:3.11-slim
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -e ".[dev]"
    - python -m pytest -q

build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:v1" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Runs before the pushes on purpose: an image that fails this never becomes :v1.
    # It replaces `docker run ... review --mr 1 || true`, which could not fail and so
    # checked nothing - the job was green while the reviewer died on startup.
    - sh scripts/image-selfcheck.sh "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:v1"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
