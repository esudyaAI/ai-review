include:
  - local: templates/ai-review.yml
    # The reviewer gates jobbytime-go; it has no business exempting itself. A tool
    # that blocks other people's merge requests and lets its own through on a
    # warning is trusted less than it asks others to trust it.
    #
    # Two things make this safe to switch on here, and both are load-bearing:
    #
    # 1. `python -m reviewer` runs from the checked-out repository, whose own
    #    `reviewer/` package shadows the one installed in the image. So this job
    #    reviews the branch's code, not the last released `v1`. Confirmed on
    #    2026-08-17: a log line added minutes earlier in a branch appeared in the
    #    job while `v1` still pointed at the previous release. Consuming
    #    repositories have no `reviewer/` directory, so there the image wins.
    # 2. The escape hatch is this very input. If a change breaks the reviewer so
    #    badly that it cannot pass its own gate, set `allow_failure: true` in the
    #    merge request that fixes it, and restore it in the same merge request
    #    once green. That is a visible, reviewable act - unlike a permanent
    #    exemption, which is invisible.
    inputs:
      allow_failure: false

stages:
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

test:
  stage: test
  image: python:3.12-slim
  interruptible: true
  script:
    - pip install -e ".[dev]"
    - python -m pytest -v

build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:v1" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" review --mr 1 || true
    - docker push "$CI_REGISTRY_IMAGE:v1"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
