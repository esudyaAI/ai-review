# Include this template to add an AI review gate to a merge request pipeline.
spec:
  inputs:
    image_tag:
      default: "v1"
    allow_failure:
      default: true
      type: boolean
---

ai-review:
  stage: test
  image:
    name: registry.gitlab.com/jobbytime.com-group/jobbytime-ai-review:$[[ inputs.image_tag ]]
    # The image's own ENTRYPOINT (python -m reviewer) is not shell-compatible: GitLab
    # Runner appends `sh -c "<script>"` to the image's entrypoint when running `script:`,
    # which the reviewer's argparse then rejects ("invalid choice: 'sh'"). An empty
    # entrypoint makes Runner fall back to plain `sh -c`, so `script:` below runs as
    # written instead of being swallowed by the image's own entrypoint.
    entrypoint: [""]
  interruptible: true
  allow_failure: $[[ inputs.allow_failure ]]
  rules:
    # Черновик не ревьюируется. Правило первое, потому что GitLab берёт первое
    # подошедшее: правило про merge_request_event ниже поймало бы Draft тоже.
    #
    # Замер за 2026-08-30/31 по двум репозиториям: 23 прогона, от $0.03 до
    # $0.74. Самый дорогой — как раз на Draft: 20 итераций, 165 КБ прочитано,
    # обе модели. Вдесятеро дороже среднего, и потрачено на код, который ещё
    # пишут.
    #
    # Автор ничего не теряет: снятие префикса Draft перезапускает пайплайн
    # merge request, и ревью пройдёт тогда же, когда и раньше — перед мержем.
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  # Exit codes are the reviewer's contract with the pipeline:
  #   0 - clean, 1 - blocking findings, 2 - the review did not happen (technical),
  #   3 - the review did not happen (diff over the limit).
  # Only 2 is worth retrying. Retrying 1 costs a second review and cannot change the
  # answer - findings are a function of the diff, not of the attempt. Retrying 3 is
  # pointless: the diff is the same size on the second run. One retry, not two: a
  # second failure is not a network blip, it is something to fix by hand, and every
  # extra attempt is paid for in model tokens.
  retry:
    max: 1
    exit_codes: [2]
  variables:
    GIT_DEPTH: "0"
  script:
    - python -m reviewer review --mr "$CI_MERGE_REQUEST_IID"
